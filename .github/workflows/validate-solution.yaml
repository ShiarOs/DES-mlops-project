name: Validate Solution

on:
  push:
    paths:
      - ".github/workflows/validate-solution.yaml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "my_solution/**"
  pull_request:
    paths:
      - ".github/workflows/validate-solution.yaml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "my_solution/**"

jobs:
  validate-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Reproduce the DVC pipeline
        working-directory: my_solution
        run: uv run dvc repro